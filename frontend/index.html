<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossMatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/vditor@3.10.5/dist/index.css" />
</head>
<body>
    <div id="app">
        <aside class="sidebar">
            <div class="logo">BossMatch</div>
            <nav class="nav">
                <a href="#dashboard" class="nav-item active" data-page="dashboard">工作台</a>
                <a href="#resume-center" class="nav-item" data-page="resume-center">简历中心</a>
                <a href="#job-center" class="nav-item" data-page="job-center">职位中心</a>
                <a href="#settings" class="nav-item" data-page="settings">设置</a>
            </nav>
        </aside>
        <main class="main">
            <header class="topbar">
                <div class="identity-switch">
                    <button class="identity-btn active" data-mode="geek">求职者</button>
                    <button class="identity-btn" data-mode="boss">招聘者</button>
                </div>
                <div class="version">v0.1.0</div>
            </header>
            <div id="content" class="content">
                <!-- Pages rendered dynamically by app.js -->
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/vditor@3.10.5/dist/index.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
